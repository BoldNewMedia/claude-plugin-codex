<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">Claude Code Advisor for Codex</title>
  <desc id="desc">Social preview for an unofficial community plugin that brings local Claude Code reviews into Codex.</desc>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#1F2937" stroke-width="1" opacity="0.42"/>
    </pattern>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#D97706" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#D97706" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#020617" flood-opacity="0.48"/>
    </filter>
  </defs>

  <rect width="1280" height="640" fill="#0B1220"/>
  <rect width="1280" height="640" fill="url(#grid)"/>
  <circle cx="1090" cy="74" r="360" fill="url(#glow)"/>

  <g transform="translate(86 74)">
    <rect width="72" height="72" rx="16" fill="#D97706"/>
    <path d="M20.25 25.31 34.31 15.75v9.56L27 30.38l7.31 5.06V45L20.25 35.44V25.31Z" fill="#FFF7ED"/>
    <path d="M51.75 46.69 37.69 56.25v-9.56L45 41.62l-7.31-5.06V27L51.75 36.56v10.13Z" fill="#111827"/>
    <circle cx="36" cy="36" r="5.63" fill="#FFF7ED"/>
  </g>

  <g font-family="Inter, Helvetica Neue, Arial, sans-serif">
    <text x="86" y="222" fill="#F9FAFB" font-size="66" font-weight="700" letter-spacing="-1.8">Claude Code Advisor</text>
    <text x="86" y="286" fill="#CBD5E1" font-size="31" font-weight="400">A second opinion for Codex.</text>

    <g transform="translate(86 352)" filter="url(#shadow)">
      <rect width="1108" height="114" rx="20" fill="#111827" stroke="#334155"/>
      <rect x="24" y="26" width="8" height="62" rx="4" fill="#D97706"/>
      <text x="56" y="55" fill="#F8FAFC" font-size="21" font-weight="650">Read-only reviews · adversarial checks · local Claude Code</text>
      <text x="56" y="87" fill="#94A3B8" font-size="18">Codex stays in charge. Claude challenges the assumptions.</text>
    </g>

    <g transform="translate(86 526)">
      <rect width="326" height="42" rx="21" fill="#FFF7ED"/>
      <text x="22" y="27" fill="#9A4B05" font-family="Menlo, Monaco, Consolas, monospace" font-size="16" font-weight="700">$claude adversarial-review</text>
    </g>
    <text x="1194" y="554" fill="#64748B" font-size="15" text-anchor="end">Unofficial community plugin</text>
  </g>
</svg>
