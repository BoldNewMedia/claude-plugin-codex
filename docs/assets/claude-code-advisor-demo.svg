<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800" role="img" aria-labelledby="title desc">
  <title id="title">Claude Code Advisor installation and adversarial review demo</title>
  <desc id="desc">An illustrative terminal session that adds the marketplace and plugin, checks setup, and returns one sanitised finding from an adversarial review.</desc>
  <defs>
    <filter id="terminalShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#020617" flood-opacity="0.55"/>
    </filter>
    <linearGradient id="headerGlow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#D97706" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#D97706" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="800" fill="#0B1220"/>
  <rect x="40" y="32" width="1200" height="736" rx="24" fill="#111827" stroke="#334155" filter="url(#terminalShadow)"/>
  <path d="M64 32h1152a24 24 0 0 1 24 24v52H40V56a24 24 0 0 1 24-24Z" fill="#172033"/>
  <rect x="40" y="108" width="1200" height="84" fill="url(#headerGlow)"/>

  <circle cx="76" cy="70" r="7" fill="#F87171"/>
  <circle cx="100" cy="70" r="7" fill="#FBBF24"/>
  <circle cx="124" cy="70" r="7" fill="#4ADE80"/>

  <g transform="translate(154 50)">
    <rect width="40" height="40" rx="9" fill="#D97706"/>
    <path d="M11.25 14.06 19.06 8.75v5.31L15 16.88l4.06 2.81V25L11.25 19.69v-5.63Z" fill="#FFF7ED"/>
    <path d="M28.75 25.94 20.94 31.25v-5.31L25 23.12l-4.06-2.81V15L28.75 20.31v5.63Z" fill="#111827"/>
    <circle cx="20" cy="20" r="3.13" fill="#FFF7ED"/>
  </g>

  <g font-family="Inter, Helvetica Neue, Arial, sans-serif">
    <text x="210" y="76" fill="#E5E7EB" font-size="18" font-weight="650">Claude Code Advisor</text>
    <text x="1204" y="75" fill="#64748B" font-size="14" text-anchor="end">ILLUSTRATIVE SESSION</text>
  </g>

  <g font-family="Menlo, Monaco, Consolas, Liberation Mono, monospace" font-size="18">
    <text x="76" y="142" fill="#64748B">01</text>
    <text x="120" y="142" fill="#FBBF24">%</text>
    <text x="146" y="142" fill="#F8FAFC">codex plugin marketplace add BoldNewMedia/claude-plugin-codex</text>
    <text x="146" y="174" fill="#86EFAC">✓ Marketplace added</text>

    <text x="76" y="222" fill="#64748B">02</text>
    <text x="120" y="222" fill="#FBBF24">%</text>
    <text x="146" y="222" fill="#F8FAFC">codex plugin add claude-code-advisor@claude-plugin-codex</text>
    <text x="146" y="254" fill="#86EFAC">✓ Plugin enabled</text>

    <text x="76" y="302" fill="#64748B">03</text>
    <text x="120" y="302" fill="#60A5FA">›</text>
    <text x="146" y="302" fill="#F8FAFC">$claude setup</text>
    <text x="146" y="334" fill="#94A3B8">Claude Code found · authentication ready · read-only review available</text>

    <text x="76" y="382" fill="#64748B">04</text>
    <text x="120" y="382" fill="#60A5FA">›</text>
    <text x="146" y="382" fill="#F8FAFC">$claude adversarial-review</text>
    <text x="146" y="414" fill="#94A3B8">Challenge the rollout plan and identify hidden assumptions.</text>
  </g>

  <g transform="translate(76 454)">
    <rect width="1128" height="220" rx="16" fill="#0F172A" stroke="#475569"/>
    <rect width="1128" height="46" rx="16" fill="#1E293B"/>
    <path d="M0 46h1128" stroke="#475569"/>
    <rect x="20" y="14" width="78" height="22" rx="11" fill="#7C2D12"/>
    <text x="59" y="30" fill="#FED7AA" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle">FINDING</text>
    <text x="112" y="30" fill="#CBD5E1" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="14">Sanitised illustrative output</text>

    <g font-family="Menlo, Monaco, Consolas, Liberation Mono, monospace" font-size="18">
      <text x="24" y="84" fill="#FDBA74" font-weight="700">[P1] Rollback depends on a schema that the migration removes</text>
      <text x="24" y="122" fill="#E2E8F0">The plan drops the legacy column before every reader has moved.</text>
      <text x="24" y="154" fill="#E2E8F0">A rollback would restore the old code without restoring its data.</text>
      <text x="24" y="194" fill="#86EFAC">Next: split the schema change into a later, separately verified release.</text>
    </g>
  </g>

  <g font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="14">
    <text x="76" y="720" fill="#64748B">Local Claude Code · Codex remains the orchestrator · read-only by default</text>
    <text x="1204" y="720" fill="#64748B" text-anchor="end">Unofficial community plugin</text>
  </g>
</svg>
